name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: octapoint
          POSTGRES_PASSWORD: octapoint
          POSTGRES_DB: octapoint
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U octapoint -d octapoint"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://octapoint:octapoint@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # Switch to --frozen-lockfile after pnpm-lock.yaml has been committed.
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
