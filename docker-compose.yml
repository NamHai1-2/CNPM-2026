version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: octapoint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: octapoint
      POSTGRES_PASSWORD: octapoint_dev_password
      POSTGRES_DB: octapoint_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: octapoint-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: octapoint-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse

volumes:
  pgdata:
  redisdata:
  chdata:
